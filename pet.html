<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Profile</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .pet-detail {
            text-align: center;
            padding: 40px;
        }
        .pet-detail img {
            max-width: 50%;
            border-radius: 20px;
            float: left;
        }
        body{
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
<div class="container pet-detail">
    <h1 id="pet-name">Pet Name</h1>
    <img id="pet-image" src="" alt="Pet">
    <ul class="list-group list-group-flush">
        <li class="list-group-item"><strong>Type:</strong> <span id="pet-type"></span></li>
        <li class="list-group-item"><strong>Breed:</strong> <span id="pet-breed"></span></li>
        <li class="list-group-item"><strong>Sex:</strong> <span id="pet-sex"></span></li>
        <li class="list-group-item"><strong>Color:</strong> <span id="pet-color"></span></li>
        <li class="list-group-item"><strong>Age:</strong> <span id="pet-age"></span></li>
        <li><strong>Description:</strong> <span id="petDescription"></span></li>
    </ul>
</div>

<script>
    
    const params = new URLSearchParams(window.location.search);
    //Added feature to limit users from visiting a pet page without there being pet information to view 
    if(!params.get("name"))
    window.location.href = "index.html"

    document.getElementById("pet-name").textContent = params.get("name");
    document.getElementById("pet-type").textContent = params.get("type");
    document.getElementById("pet-breed").textContent = params.get("breed");
    document.getElementById("pet-sex").textContent = params.get("sex");
    document.getElementById("pet-color").textContent = params.get("color");
    document.getElementById("pet-age").textContent = params.get("age");
    document.getElementById("pet-image").src = "photos/" + params.get("name") + ".jpg";
    document.getElementById('petDescription').innerText = decodeURIComponent(params.get('description'));
</script>

</body>
</html>
